<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julian's Editor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Bubblegum Sans', 'Chalkboard SE', sans-serif;
            background-color: #5bc5f2;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 450px;
            margin: 0 auto;
            background-color: #5bc5f2;
            overflow: hidden;
        }

        /* Unified Graphic Container with v0.8.0 included */
        .logo-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 410px;
            height: 540px;
            z-index: 5;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* Countdown Number - WHITE text */
        .countdown {
            position: absolute;
            top: 590px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #FFFFFF;
            font-weight: bold;
            z-index: 6;
        }

        /* Start Button - Exact right color, no bottom blue shadow/part */
        .start-btn {
            position: absolute;
            top: 630px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #72E683;
            color: #000;
            font-size: 26px;
            font-weight: bold;
            font-family: inherit;
            padding: 12px 45px;
            border: 3px solid #000;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: none;
            transition: transform 0.1s ease;
            z-index: 10;
        }

        .start-btn:active {
            transform: translateX(-50%) translateY(2px);
        }

        /* Account Link */
        .account-link {
            position: absolute;
            top: 715px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 16px;
            text-decoration: underline;
            white-space: nowrap;
            cursor: pointer;
            z-index: 10;
        }

        /* Bottom Land Section */
        .land {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background-image: url('jeland.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: bottom center;
            z-index: 4;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-container">
            <img src="jelogo.png" alt="Julian's Editor Logo and Graphic">
        </div>

        <div class="countdown">3</div>
        <button class="start-btn">Start!</button>
        <div class="account-link">I already have an account</div>

        <div class="land"></div>
    </div>

</body>
</html>
