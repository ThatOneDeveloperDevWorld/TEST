<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Julian's Editor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Bubblegum Sans', 'Chalkboard SE', sans-serif;
            background-color: #5bc5f2;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 450px;
            margin: 0 auto;
            background-color: #5bc5f2;
            overflow: hidden;
        }

        /* Clouds */
        .cloud {
            position: absolute;
            background-image: url('jeclouds.png');
            background-size: contain;
            background-repeat: no-repeat;
        }

        .cloud-1 { top: 5%; left: 30%; width: 140px; height: 60px; }
        .cloud-2 { top: 15%; right: 5%; width: 120px; height: 50px; }
        .cloud-3 { top: 25%; left: -20px; width: 160px; height: 70px; }
        .cloud-4 { top: 41%; left: 10%; width: 150px; height: 60px; }

        /* Version Text */
        .version {
            position: absolute;
            top: 235px;
            right: 45px;
            font-size: 16px;
            font-weight: bold;
            color: #000;
        }

        /* Earth Logo */
        .earth-container {
            position: absolute;
            top: 150px;
            left: 50%;
            transform: translateX(-50%);
            width: 280px;
            height: 280px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .earth {
            width: 100%;
            height: 100%;
            background-image: url('jeearth.png');
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
        }

        /* Julian's Editor Logo Overlay */
        .logo-overlay {
            position: absolute;
            top: 120px;
            left: 50%;
            transform: translateX(-50%);
            width: 240px;
            height: auto;
            z-index: 5;
        }

        .logo-overlay img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Countdown Number */
        .countdown {
            position: absolute;
            top: 610px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            color: #6c757d;
            font-weight: bold;
        }

        /* Start Button */
        .start-btn {
            position: absolute;
            top: 650px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #4cd137;
            color: #000;
            font-size: 26px;
            font-weight: bold;
            font-family: inherit;
            padding: 12px 45px;
            border: 3px solid #000;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #2e86de;
            transition: transform 0.1s ease;
            z-index: 10;
        }

        .start-btn:active {
            transform: translateX(-50%) translateY(4px);
            box-shadow: 0 0 0 #2e86de;
        }

        /* Account Link */
        .account-link {
            position: absolute;
            top: 730px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 16px;
            text-decoration: underline;
            white-space: nowrap;
            cursor: pointer;
            z-index: 10;
        }

        /* Bottom Land Section */
        .land {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            background-image: url('jeland.png');
            background-size: cover;
            background-repeat: no-repeat;
            background-position: bottom center;
            z-index: 4;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>
        <div class="cloud cloud-3"></div>
        <div class="cloud cloud-4"></div>

        <div class="version">v0.8.0</div>

        <div class="earth-container">
            <div class="earth"></div>
        </div>
        
        <div class="logo-overlay">
            <img src="jelogo.png" alt="Julian's Editor Logo">
        </div>

        <div class="countdown">3</div>
        <button class="start-btn">Start!</button>
        <div class="account-link">I already have an account</div>

        <div class="land"></div>
    </div>

</body>
  </html>
